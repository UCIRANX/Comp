# ورک‌فلوی گیت‌هاب: ساخت باینری استاتیک telegram-bot-api از سورس رسمی (tdlib)
# مسیر در ریپو: .github/workflows/build-telegram-bot-api.yml
# بعد از بیلد، باینری در بخش Releases ریپو منتشر می‌شود تا با لینک مستقیم (BOTAPI_URL) دانلود شود.
# توجه: این فایل آزمایش نشده؛ اگر بیلد خطا داد لاگ را بفرست تا اصلاح کنیم.
name: build-telegram-bot-api
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: بیلد استاتیک روی Alpine (musl) تا روی هر سرور لینوکسی اجرا شود
        run: |
          mkdir -p out
          docker run --rm -v "$PWD/out:/out" alpine:3.20 sh -c '
            apk add --no-cache build-base cmake git gperf linux-headers openssl-dev openssl-libs-static zlib-dev zlib-static &&
            git clone --recursive --depth 1 https://github.com/tdlib/telegram-bot-api.git &&
            cd telegram-bot-api && mkdir build && cd build &&
            cmake -DCMAKE_BUILD_TYPE=Release -DOPENSSL_USE_STATIC_LIBS=TRUE -DZLIB_USE_STATIC_LIBS=ON \
                  -DCMAKE_EXE_LINKER_FLAGS="-static" .. &&
            cmake --build . --target telegram-bot-api -j2 &&
            strip telegram-bot-api && cp telegram-bot-api /out/'
          ls -la out
          sha256sum out/telegram-bot-api
      - name: انتشار باینری در Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "bot-api-${{ github.run_number }}" out/telegram-bot-api \
            --repo "${{ github.repository }}" \
            --title "telegram-bot-api build ${{ github.run_number }}" \
            --notes "sha256: $(sha256sum out/telegram-bot-api | cut -d' ' -f1)"
